{{ include "soc.pvc" (dict "root" . "name" (printf "%s-ollama" .Release.Name) "size" .Values.ollama.storage) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ollama
  labels: {{- include "soc.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: ollama, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: "60m"}
            - {name: OLLAMA_NUM_PARALLEL, value: "1"}
          ports: [{containerPort: 11434, name: http}]
          readinessProbe: {httpGet: {path: /api/tags, port: http}, periodSeconds: 10}
          resources: {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts: [{name: models, mountPath: /root/.ollama}]
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-ollama}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
  labels: {{- include "soc.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: ollama, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{port: 11434, targetPort: http, name: http}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-model-pull
  labels: {{- include "soc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {app.kubernetes.io/name: model-pull, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: {{ .Values.ollama.image }}
          command: ["ollama", "pull", {{ .Values.triage.model | quote }}]
          env: [{name: OLLAMA_HOST, value: "http://{{ .Release.Name }}-ollama:11434"}]
