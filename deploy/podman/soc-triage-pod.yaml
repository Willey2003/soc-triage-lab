apiVersion: v1
kind: Pod
metadata:
  name: soc-triage
  labels:
    app: soc-triage
spec:
  restartPolicy: Always
  containers:
  - name: ollama
    image: docker.io/ollama/ollama:0.34.4
    env:
    - name: OLLAMA_HOST
      value: 127.0.0.1:11434
    - name: OLLAMA_KEEP_ALIVE
      value: 60m
    - name: OLLAMA_NUM_PARALLEL
      value: '1'
    - name: OLLAMA_MAX_LOADED_MODELS
      value: '1'
    resources:
      limits:
        cpu: '6'
        memory: 6Gi
    volumeMounts:
    - name: ollama-models
      mountPath: /root/.ollama
  - name: api
    image: localhost/soc-triage:0.1
    imagePullPolicy: Never
    env:
    - name: OLLAMA_URL
      value: http://127.0.0.1:11434
    - name: SOC_MODEL
      value: qwen2.5:1.5b
    - name: SOC_MODE
      value: hybrid
    - name: SOC_DB
      value: /data/cases.db
    ports:
    - containerPort: 8090
      hostPort: 18090
      hostIP: 127.0.0.1
    resources:
      limits:
        cpu: '1'
        memory: 512Mi
    volumeMounts:
    - name: soc-data
      mountPath: /data
  - name: feeder
    image: localhost/soc-triage:0.1
    imagePullPolicy: Never
    command:
    - python
    - -m
    - app.feeder
    env:
    - name: SOC_API
      value: http://127.0.0.1:8090
    - name: FEED_INTERVAL_S
      value: '30'
    - name: FEED_BATCH
      value: '1'
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
  - name: prometheus
    image: docker.io/prom/prometheus:v3.14.0
    args:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=7d
    - --web.listen-address=0.0.0.0:9090
    ports:
    - containerPort: 9090
      hostPort: 19090
      hostIP: 127.0.0.1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
    volumeMounts:
    - name: prom-config
      mountPath: /etc/prometheus
    - name: prom-data
      mountPath: /prometheus
  - name: grafana
    image: docker.io/grafana/grafana:13.2.2
    env:
    - name: GF_SERVER_HTTP_PORT
      value: '3000'
    - name: GF_SECURITY_ADMIN_PASSWORD
      value: __GRAFANA_ADMIN_PASSWORD__
    - name: GF_AUTH_ANONYMOUS_ENABLED
      value: 'true'
    - name: GF_AUTH_ANONYMOUS_ORG_ROLE
      value: Viewer
    - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
      value: /var/lib/grafana/dashboards/soc-triage-dashboard.json
    - name: GF_ANALYTICS_REPORTING_ENABLED
      value: 'false'
    - name: GF_ANALYTICS_CHECK_FOR_UPDATES
      value: 'false'
    - name: GF_NEWS_NEWS_FEED_ENABLED
      value: 'false'
    ports:
    - containerPort: 3000
      hostPort: 13000
      hostIP: 127.0.0.1
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
    volumeMounts:
    - name: grafana-datasources
      mountPath: /etc/grafana/provisioning/datasources
    - name: grafana-providers
      mountPath: /etc/grafana/provisioning/dashboards
    - name: grafana-dashboards
      mountPath: /var/lib/grafana/dashboards
  volumes:
  - name: ollama-models
    persistentVolumeClaim:
      claimName: soc-ollama-models
  - name: soc-data
    persistentVolumeClaim:
      claimName: soc-data
  - name: prom-data
    persistentVolumeClaim:
      claimName: soc-prom-data
  - name: prom-config
    configMap:
      name: soc-prom-config
  - name: grafana-datasources
    configMap:
      name: soc-grafana-datasources
  - name: grafana-providers
    configMap:
      name: soc-grafana-providers
  - name: grafana-dashboards
    configMap:
      name: soc-grafana-dashboards
